%YAML:1.0

# D435i stereo infrared images + external PX4/NxtPX4v2 IMU through MAVROS.
# MAVROS publishes PX4 HIGHRES_IMU as /mavros/imu/data_raw.

# common parameters
imu: 1
num_of_cam: 2

imu_topic: "/mavros/imu/data_raw"
image0_topic: "/camera/infra1/image_rect_raw"
image1_topic: "/camera/infra2/image_rect_raw"
output_path: "/tmp/vins_output/"

cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 640
image_height: 480

estimate_extrinsic: 0

# Calibrated with Kalibr on d435i_px4_20260606_180824.bag.
# Kalibr reports T_cam_imu; VINS expects T_imu_cam, so these matrices are the inverse.
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -0.99899937278, -0.012291573242, -0.0430019814961, 0.0167570302372,
           0.0444103109686, -0.158916313398, -0.986292720046, -0.0160595462522,
           0.00528937283831, -0.987215540074, 0.15930317, -0.0239205214303,
           0., 0., 0., 1.0 ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -0.999054070443, -0.012154090196, -0.041752154704, -0.0324095425631,
           0.043152985036, -0.158641273845, -0.986392805182, -0.0141963994606,
           0.00536509211488, -0.98726147718, 0.159015695647, -0.0235341316162,
           0., 0., 0., 1.0 ]

# Multiple thread support
multiple_thread: 1

# feature tracker parameters
max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 0
flow_back: 1

# optimization parameters
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0

# IMU parameters from d435i_px4_20260606_180824-imu.yaml used by Kalibr.
acc_n: 0.02
gyr_n: 0.0017
acc_w: 0.0005
gyr_w: 3e-05
g_norm: 9.805

# unsynchronization parameters
estimate_td: 1
td: -0.000669290608484

# loop closure parameters
load_previous_pose_graph: 0
pose_graph_save_path: "/tmp/vins_output/pose_graph/"
save_image: 1
show_track: 1