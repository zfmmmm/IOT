%YAML:1.0

# D435i stereo infrared images + external PX4/NxtPX4v2 IMU through MAVROS.
# MAVROS publishes PX4 HIGHRES_IMU as /mavros/imu/data_raw.

# common parameters
imu: 1
num_of_cam: 2

imu_topic: "/mavros/imu/data_raw"
image0_topic: "/camera/infra1/image_rect_raw"
image1_topic: "/camera/infra2/image_rect_raw"
output_path: "/tmp/vins_output/"

cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 640
image_height: 480

estimate_extrinsic: 1

# Calibrated with Kalibr on d435i_px4_20260606_142203.bag.
# Kalibr reports T_cam_imu; VINS expects T_imu_cam, so these matrices are the inverse.
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -0.998816621039, -0.013383310472, -0.0467572939399, 0.0214250800901,
           0.0483510026314, -0.1695150467, -0.984340809622, -0.0146495463997,
           0.00524767379962, -0.98543672346, 0.16996154264, -0.0303315608667,
           0., 0., 0., 1.0 ]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -0.998863938517, -0.0133275446792, -0.0457515997978, -0.0278449631542,
           0.0473481994514, -0.169110667995, -0.984459105285, -0.0126878353808,
           0.00538333910684, -0.985506955086, 0.169549583123, -0.0299146577016,
           0., 0., 0., 1.0 ]

# Multiple thread support
multiple_thread: 1

# feature tracker parameters
max_cnt: 190
min_dist: 25
freq: 10
F_threshold: 1.0
show_track: 1
flow_back: 1

# optimization parameters
max_solver_time: 0.03
max_num_iterations: 10
keyframe_parallax: 10.0

# IMU parameters from d435i_px4_20260606_142203-imu.yaml used by Kalibr.
acc_n: 0.08
gyr_n: 0.005
acc_w: 0.002
gyr_w: 1e-04
g_norm: 9.805

# unsynchronization parameters
estimate_td: 1
td: 0.00605930175888

# loop closure parameters
load_previous_pose_graph: 0
pose_graph_save_path: "/tmp/vins_output/pose_graph/"
save_image: 0
